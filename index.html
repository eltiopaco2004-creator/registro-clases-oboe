<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f5d50"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Registro de Clases de Oboe</title>
<style>
:root{--bg:#f5f3ee;--card:#fff;--ink:#202522;--muted:#69716d;--accent:#2f5d50;--accent2:#dfe9e4;--line:#d9ddd9;--danger:#a44242}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}#app{min-height:100vh;padding:18px 14px 36px}.wrap{max-width:720px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.title h1{font-size:24px;margin:0}.title p{margin:4px 0 0;color:var(--muted);font-size:13px}.badge{background:var(--accent2);color:var(--accent);padding:7px 10px;border-radius:999px;font-size:12px;font-weight:700}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #00000008}label{display:block;font-size:13px;font-weight:700;margin:12px 0 6px}input,textarea,select{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;background:#fff;color:var(--ink)}textarea{min-height:92px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}button{border:0;border-radius:12px;padding:11px 14px;font-weight:700;font:inherit;cursor:pointer}.primary{background:var(--accent);color:white}.secondary{background:var(--accent2);color:var(--accent)}.danger{background:#f5e2e2;color:var(--danger)}button:disabled{opacity:.5;cursor:not-allowed}.rec{display:flex;align-items:center;gap:10px;background:#f7f7f4;border:1px dashed var(--line);padding:12px;border-radius:13px;margin-top:10px}.dot{width:10px;height:10px;border-radius:50%;background:#bbb}.dot.on{background:#b83c3c;box-shadow:0 0 0 5px #b83c3c20}.item{border-top:1px solid var(--line);padding:14px 0}.item:first-child{border-top:0}.meta{font-size:12px;color:var(--muted)}.grade{font-size:20px;font-weight:800;color:var(--accent)}.audio{width:100%;margin-top:8px}.small{font-size:12px;color:var(--muted);line-height:1.45}.empty{text-align:center;color:var(--muted);padding:22px}.notice{padding:11px 12px;background:#eef3f0;border-radius:12px;font-size:13px;margin-top:10px}.hidden{display:none}@media(max-width:520px){.row{grid-template-columns:1fr}.top{align-items:flex-start}.title h1{font-size:21px}}
</style></head>
<body><main id="app"><div class="wrap">
<header class="top"><div class="title"><h1>🎵 Registro de Clases de Oboe</h1><p>Cuaderno digital de clases individuales</p></div><span class="badge" id="status">Local</span></header>
<section class="card"><label for="student">Alumno</label><input id="student" list="students" placeholder="Nombre y apellidos"><datalist id="students"></datalist>
<div class="row"><div><label for="date">Fecha</label><input id="date" type="date"></div><div><label for="grade">Nota</label><input id="grade" type="number" min="0" max="10" step="0.1" inputmode="decimal" placeholder="0–10"></div></div>
<label for="course">Curso / Enseñanza</label><input id="course" placeholder="Ej.: 3º Profesional">
<label for="obs">Observación</label><textarea id="obs" placeholder="Qué hemos trabajado, aspectos a mejorar, tareas para la próxima clase..."></textarea>
<div class="rec"><span class="dot" id="dot"></span><strong id="recText">Sin grabación</strong><span style="margin-left:auto" id="recTime"></span></div>
<div class="actions"><button class="secondary" id="record">🎙️ Grabar</button><button class="secondary" id="stop" disabled>⏹ Parar</button><button class="primary" id="save">💾 Guardar clase</button></div>
<div class="small" style="margin-top:10px">La información queda guardada en este dispositivo. Puedes exportar una copia con los botones de abajo.</div></section>
<section class="card"><div class="actions" style="margin-top:0"><button class="secondary" id="backup">📦 Copia de seguridad</button><button class="secondary" id="csv">📊 Exportar Excel/CSV</button><button class="secondary" id="chooseFolder">📁 Elegir carpeta</button></div><div id="folderNote" class="notice">Carpeta de archivos: todavía no seleccionada. La app seguirá funcionando localmente.</div></section>
<section class="card"><label for="filter">Historial</label><input id="filter" placeholder="Buscar alumno..."><div id="history"></div></section>
</div></main>
<script>
const KEY='oboeLessonsV2';let lessons=JSON.parse(localStorage.getItem(KEY)||'[]');let mediaRecorder=null,chunks=[],audioBlob=null,started=0,timer=null,dirHandle=null;
const $=id=>document.getElementById(id);$('date').value=new Date().toISOString().slice(0,10);
function persist(){localStorage.setItem(KEY,JSON.stringify(lessons.map(x=>({...x,audioUrl:undefined}))));}
function fmt(d){return new Date(d+'T12:00:00').toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit',year:'numeric'})}
function renderStudents(){let names=[...new Set(lessons.map(x=>x.student).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'es'));$('students').innerHTML=names.map(n=>`<option value="${esc(n)}">`).join('')}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){renderStudents();let q=$('filter').value.trim().toLowerCase();let arr=lessons.filter(x=>!q||x.student.toLowerCase().includes(q)).sort((a,b)=>b.created-a.created);if(!arr.length){$('history').innerHTML='<div class="empty">Todavía no hay clases registradas.</div>';return}$('history').innerHTML=arr.map(x=>`<article class="item"><div style="display:flex;gap:10px;align-items:center"><div style="flex:1"><strong>${esc(x.student)}</strong><div class="meta">${fmt(x.date)}${x.course?' · '+esc(x.course):''}</div></div><div class="grade">${Number(x.grade).toLocaleString('es-ES')}</div></div>${x.obs?`<p style="white-space:pre-wrap">${esc(x.obs)}</p>`:''}${x.audioData?`<audio class="audio" controls src="${x.audioData}"></audio>`:''}<div class="actions"><button class="danger" onclick="removeLesson('${x.id}')">Eliminar</button></div></article>`).join('')}
window.removeLesson=id=>{if(confirm('¿Eliminar esta clase?')){lessons=lessons.filter(x=>x.id!==id);persist();render()}};
$('filter').oninput=render;
$('record').onclick=async()=>{try{let stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];mediaRecorder=new MediaRecorder(stream);mediaRecorder.ondataavailable=e=>e.data.size&&chunks.push(e.data);mediaRecorder.onstop=()=>{let blob=new Blob(chunks,{type:mediaRecorder.mimeType||'audio/webm'});let r=new FileReader();r.onload=()=>{audioBlob=r.result;};r.readAsDataURL(blob);stream.getTracks().forEach(t=>t.stop())};mediaRecorder.start();started=Date.now();$('record').disabled=true;$('stop').disabled=false;$('dot').classList.add('on');$('recText').textContent='Grabando…';timer=setInterval(()=>{$('recTime').textContent=((Date.now()-started)/1000).toFixed(0)+' s'},200)}catch(e){alert('No se ha podido acceder al micrófono. Comprueba el permiso de Chrome.')}};
$('stop').onclick=()=>{if(mediaRecorder&&mediaRecorder.state!=='inactive'){mediaRecorder.stop();$('record').disabled=false;$('stop').disabled=true;$('dot').classList.remove('on');$('recText').textContent='Grabación preparada';clearInterval(timer)}};
$('save').onclick=async()=>{let student=$('student').value.trim(),grade=$('grade').value;if(!student||grade===''){alert('Indica al menos el alumno y la nota.');return}let item={id:crypto.randomUUID(),student,date:$('date').value,grade:Number(grade),course:$('course').value.trim(),obs:$('obs').value.trim(),audioData:audioBlob||null,created:Date.now()};lessons.push(item);persist();if(dirHandle) await saveFiles(item);$('student').value='';$('grade').value='';$('obs').value='';audioBlob=null;$('recText').textContent='Sin grabación';$('recTime').textContent='';render();alert('Clase guardada.');};
async function saveFiles(item){try{let root=dirHandle;let folder=await root.getDirectoryHandle('Grabaciones',{create:true});let safe=item.student.replace(/[\\/:*?"<>|]/g,'_').trim()||'Sin nombre';let stu=await folder.getDirectoryHandle(safe,{create:true});if(item.audioData){let bin=atob(item.audioData.split(',')[1]),arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);let fh=await stu.getFileHandle(item.date+'_'+item.id+'.webm',{create:true});let w=await fh.createWritable();await w.write(arr);await w.close()}}catch(e){console.warn(e)}}
$('chooseFolder').onclick=async()=>{if(!window.showDirectoryPicker){alert('Este navegador no permite seleccionar carpetas directamente. La app seguirá funcionando en local y podrás usar las copias de seguridad.');return}try{dirHandle=await showDirectoryPicker({mode:'readwrite'});$('folderNote').textContent='Carpeta seleccionada. Las nuevas grabaciones se copiarán dentro de Grabaciones/Alumno/.'}catch(e){if(e.name!=='AbortError')alert('No se pudo seleccionar la carpeta.')}};
$('csv').onclick=()=>{let rows=[['Fecha','Alumno','Curso','Nota','Observación','Tiene grabación'],...lessons.map(x=>[x.date,x.student,x.course,x.grade,x.obs,x.audioData?'Sí':'No'])];let csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\n');download(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),'Registro_Clases_Oboe.csv')};
$('backup').onclick=()=>{let data={version:2,exportedAt:new Date().toISOString(),lessons};download(new Blob([JSON.stringify(data)],{type:'application/json'}),'Copia_Registro_Clases_Oboe.json')};
function download(blob,name){let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
render();
</script></body></html>
