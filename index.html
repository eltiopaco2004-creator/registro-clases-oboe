<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Registro de Clases de Oboe</title><style>
body{font-family:system-ui;margin:0;background:#f5f3ee;color:#202522}.wrap{max-width:720px;margin:auto;padding:16px}.card{background:white;border:1px solid #ddd;border-radius:16px;padding:16px;margin:12px 0}label{display:block;font-weight:700;font-size:13px;margin:10px 0 5px}input,select,textarea{width:100%;box-sizing:border-box;padding:11px;border:1px solid #ccc;border-radius:10px;font:inherit}textarea{min-height:80px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}button{border:0;border-radius:10px;padding:10px 13px;margin:6px 4px 0 0;font-weight:700}.primary{background:#2f5d50;color:#fff}.secondary{background:#dfe9e4;color:#2f5d50}.danger{background:#f3dddd;color:#a44242}.item{border-top:1px solid #ddd;padding:12px 0}.muted{color:#69716d;font-size:12px}.grade{float:right;font-size:20px;font-weight:800;color:#2f5d50}.hidden{display:none}.rec{padding:10px;background:#f7f7f4;border-radius:10px;margin-top:8px}
</style></head><body><div class="wrap">
<header><h1>🎵 Registro de Clases de Oboe</h1><p class="muted">Cuaderno digital de clases individuales</p></header>

<section class="card"><label>📚 Curso escolar</label><select id="schoolYear"></select><p class="muted">Las clases e historial corresponden al curso seleccionado.</p></section>



<section class="card"><h2>📝 Nueva clase</h2><label>Alumno</label><select id="student"><option value="">Selecciona un alumno…</option></select><div class="row"><div><label>Fecha</label><input id="date" type="date"></div><div><label>Estado</label><select id="attendance"><option value="asiste">🟢 Asiste</option><option value="falta">🔴 Falta</option></select></div></div><div id="gradeBox"><label>Nota</label><input id="grade" type="number" min="0" max="10" step=".1"></div><label>Observación</label><textarea id="obs"></textarea><div class="rec"><span id="recText">Sin grabación</span> <span id="recTime"></span></div><button class="secondary" id="record">🎙️ Grabar</button><button class="secondary" id="stop" disabled>⏹ Parar</button><button class="primary" id="save">💾 Guardar clase</button></section>

<section class="card"><button class="secondary" id="backup">📦 Copia de seguridad</button><button class="secondary" id="csv">📊 Exportar CSV</button><button class="secondary" id="chooseFolder">📁 Elegir carpeta</button><div id="folderNote" class="muted">Carpeta de grabaciones no seleccionada.</div></section>

<section class="card"><h2>📚 Historial</h2><p class="muted">Pulsa sobre el nombre de un alumno para ver todas sus clases.</p><div id="history"></div></section>



</div><script>
const LK="oboeLessonsV2",SK="oboeStudentsV1",YK="oboeSchoolYearV1",q=id=>document.getElementById(id);
let lessons=JSON.parse(localStorage.getItem(LK)||"[]"),students=JSON.parse(localStorage.getItem(SK)||"[]"),media=null,chunks=[],audioData=null,dir=null,edit=null;
function yr(){let d=new Date(),y=d.getFullYear();return d.getMonth()+1>=9?`${y}-${String(y+1).slice(-2)}`:`${y-1}-${String(y).slice(-2)}`}
function initYears(){let y=parseInt(yr()),s="";for(let i=y-4;i<=y+5;i++)s+=`<option>${i}-${String(i+1).slice(-2)}</option>`;q("schoolYear").innerHTML=s;q("schoolYear").value=localStorage.getItem(YK)||yr()}
function year(){return q("schoolYear").value}initYears();q("schoolYear").onchange=()=>{localStorage.setItem(YK,year());renderStudents();renderSelect();render()};
q("date").value=new Date().toISOString().slice(0,10);
const esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function saveL(){localStorage.setItem(LK,JSON.stringify(lessons.map(x=>({...x,audioUrl:undefined}))));}function saveS(){localStorage.setItem(SK,JSON.stringify(students))}
function renderStudents(){if(!students.length){q("studentsList").innerHTML='<p class="muted">Todavía no hay alumnos creados.</p>';return}q("studentsList").innerHTML=students.slice().sort((a,b)=>a.name.localeCompare(b.name,"es")).map(s=>{let n=lessons.filter(x=>(x.schoolYear||year())===year()&&x.studentId===s.id).length,f=lessons.filter(x=>(x.schoolYear||year())===year()&&x.studentId===s.id&&x.attendance==="falta").length;return `<div class="item"><b>${esc(s.name)}</b><div class="muted">${esc(s.course)} · ${n} clases · ${f} faltas</div><button class="secondary" onclick="editStudent('${s.id}')">✏️ Editar</button><button class="danger" onclick="deleteStudent('${s.id}')">🗑️</button></div>`}).join("")}
function renderSelect(){let old=q("student").value;q("student").innerHTML='<option value="">Selecciona un alumno…</option>'+students.slice().sort((a,b)=>a.name.localeCompare(b.name,"es")).map(s=>`<option value="${s.id}">${esc(s.name)} — ${esc(s.course)}</option>`).join("");if(students.some(s=>s.id===old))q("student").value=old}
q("addStudent").onclick=()=>{let n=q("studentName").value.trim(),c=q("studentCourse").value;if(!n||!c)return alert("Indica nombre y curso.");if(edit){let s=students.find(x=>x.id===edit);s.name=n;s.course=c;lessons.forEach(x=>{if(x.studentId===edit){x.student=n;x.course=c}});edit=null;q("addStudent").textContent="➕ Añadir alumno";q("cancelEdit").classList.add("hidden");saveL();saveS()}else{if(students.some(s=>s.name.toLowerCase()===n.toLowerCase()))return alert("Ese alumno ya existe.");students.push({id:crypto.randomUUID(),name:n,course:c});saveS()}q("studentName").value="";q("studentCourse").value="";renderStudents();renderSelect();render()};
q("cancelEdit").onclick=()=>{edit=null;q("studentName").value="";q("studentCourse").value="";q("addStudent").textContent="➕ Añadir alumno";q("cancelEdit").classList.add("hidden")};
window.editStudent=id=>{let s=students.find(x=>x.id===id);edit=id;q("studentName").value=s.name;q("studentCourse").value=s.course;q("addStudent").textContent="💾 Guardar cambios";q("cancelEdit").classList.remove("hidden")};
window.deleteStudent=id=>{let s=students.find(x=>x.id===id),n=lessons.filter(x=>x.studentId===id).length;if(confirm(`¿Eliminar a ${s.name}?${n?`\nSus ${n} clases NO se borrarán.`:""}`)){students=students.filter(x=>x.id!==id);saveS();renderStudents();renderSelect()}};
q("attendance").onchange=()=>{let f=q("attendance").value==="falta";q("grade").disabled=f;if(f)q("grade").value=""};
let selectedStudentHistory=null;
function render(){
  renderHistoryStudents();
}
window.renderHistoryStudents=renderHistoryStudents;
function renderHistoryStudents(){
  const term=(q("filter")?.value||"").toLowerCase();
  const y=year();
  if(selectedStudentHistory){
    renderStudentHistory(selectedStudentHistory);
    return;
  }
  const a=lessons.filter(x=>(x.schoolYear||y)===y);
  const list=students.slice().sort((a,b)=>a.name.localeCompare(b.name,"es"))
    .filter(s=>!term||s.name.toLowerCase().includes(term));
  q("history").innerHTML=
    `<input id="filter" placeholder="Buscar alumno…" value="${esc(term)}" oninput="renderHistoryStudents()">`+
    (list.length?list.map(s=>{
      const ls=a.filter(x=>x.studentId===s.id);
      const f=ls.filter(x=>x.attendance==="falta").length;
      const notes=ls.filter(x=>x.attendance!=="falta"&&x.grade!==null&&x.grade!=="").map(x=>Number(x.grade));
      const avg=notes.length?(notes.reduce((p,n)=>p+n,0)/notes.length).toFixed(2):"—";
      return `<div class="item" style="cursor:pointer" onclick="openStudentHistory('${s.id}')">
        <b>${esc(s.name)}</b>
        <div class="muted">${esc(s.course)} · ${ls.length} clases · ${f} faltas · media ${avg}</div>
        <button class="secondary" onclick="event.stopPropagation();openStudentHistory('${s.id}')">📚 Ver historial</button>
      </div>`;
    }).join(""):'<p class="muted">No hay alumnos en este curso escolar.</p>');
}
window.openStudentHistory=openStudentHistory;
function openStudentHistory(id){
  selectedStudentHistory=id;
  renderStudentHistory(id);
}
function renderStudentHistory(id){
  const s=students.find(x=>x.id===id);
  if(!s){selectedStudentHistory=null;return renderHistoryStudents();}
  const y=year();
  const a=lessons.filter(x=>(x.schoolYear||y)===y&&x.studentId===id).sort((a,b)=>(b.date||"").localeCompare(a.date||"")||b.created-a.created);
  const f=a.filter(x=>x.attendance==="falta").length;
  const notes=a.filter(x=>x.attendance!=="falta"&&x.grade!==null&&x.grade!=="").map(x=>Number(x.grade));
  const avg=notes.length?(notes.reduce((p,n)=>p+n,0)/notes.length).toFixed(2):"—";
  q("history").innerHTML=`<button class="secondary" onclick="selectedStudentHistory=null;renderHistoryStudents()">← Volver a alumnos</button>
    <h3>${esc(s.name)}</h3>
    <div class="muted">${esc(s.course)} · Curso escolar ${esc(y)}</div>
    <p><b>${a.length}</b> clases · <b>${f}</b> faltas · <b>${avg}</b> media</p>
    <div>${a.length?a.map(x=>`<div class="item">
      <span class="grade">${x.attendance==="falta"?"—":x.grade}</span>
      <b>${new Date(x.date+"T12:00:00").toLocaleDateString("es-ES")}</b>
      <div class="muted">${x.attendance==="falta"?"🔴 Falta":"🟢 Asiste"}</div>
      ${x.obs?`<p>${esc(x.obs)}</p>`:""}
      ${x.audioData?`<audio controls style="width:100%" src="${x.audioData}"></audio>`:""}
      <button class="danger" onclick="removeLesson('${x.id}')">Eliminar</button>
    </div>`).join(""):'<p class="muted">No hay clases registradas de este alumno en este curso escolar.</p>'}<section class="card"><h2>👨‍🎓 Alumnos</h2><p class="muted">Gestión de alumnos del curso. Este apartado se utiliza principalmente al inicio del curso.</p><label>Nombre y apellidos</label><input id="studentName" placeholder="Ej.: María García López"><label>Curso</label><select id="studentCourse"><option value="">Selecciona el curso…</option><optgroup label="Enseñanzas Elementales"><option>1.º Elemental</option><option>2.º Elemental</option><option>3.º Elemental</option><option>4.º Elemental</option></optgroup><optgroup label="Enseñanzas Profesionales"><option>1.º Profesional</option><option>2.º Profesional</option><option>3.º Profesional</option><option>4.º Profesional</option><option>5.º Profesional</option><option>6.º Profesional</option></optgroup></select><button class="primary" id="addStudent">➕ Añadir alumno</button><button class="secondary hidden" id="cancelEdit">Cancelar</button><div id="studentsList"></div></section></div>`;
}
window.removeLesson=id=>{if(confirm("¿Eliminar esta clase?")){lessons=lessons.filter(x=>x.id!==id);saveL();render();renderStudents()}};
q("record").onclick=async()=>{try{let st=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];media=new MediaRecorder(st);media.ondataavailable=e=>e.data.size&&chunks.push(e.data);media.onstop=()=>{let b=new Blob(chunks,{type:media.mimeType||"audio/webm"}),r=new FileReader();r.onload=()=>audioData=r.result;r.readAsDataURL(b);st.getTracks().forEach(t=>t.stop())};media.start();q("record").disabled=true;q("stop").disabled=false;q("recText").textContent="🔴 Grabando…"}catch(e){alert("No se ha podido acceder al micrófono.")}};
q("stop").onclick=()=>{if(media&&media.state!=="inactive"){media.stop();q("record").disabled=false;q("stop").disabled=true;q("recText").textContent="Grabación preparada"}};
function filename(name,date){let p=name.trim().split(/\s+/),first=(p[0]||"Grabacion").replace(/[\\/:*?"<>|]/g,"_"),ini=p.slice(1).map(x=>x[0]).join("").toUpperCase(),d=new Date(),t=`${String(d.getHours()).padStart(2,"0")}-${String(d.getMinutes()).padStart(2,"0")}`;return `${first}${ini?"_"+ini:""}_${date}_${t}.webm`}
q("save").onclick=async()=>{let sid=q("student").value,att=q("attendance").value,g=q("grade").value;if(!sid)return alert("Selecciona un alumno.");if(att==="asiste"&&g==="")return alert("Indica la nota o marca falta.");let s=students.find(x=>x.id===sid),item={id:crypto.randomUUID(),studentId:sid,student:s.name,course:s.course,date:q("date").value,attendance:att,grade:att==="falta"?null:Number(g),obs:q("obs").value.trim(),schoolYear:year(),audioData:audioData||null,created:Date.now()};lessons.push(item);saveL();if(dir&&audioData)await saveFile(item);q("student").value="";q("grade").value="";q("obs").value="";q("attendance").value="asiste";q("grade").disabled=false;audioData=null;q("recText").textContent="Sin grabación";render();renderStudents();alert("Clase guardada.")};
async function saveFile(x){try{let f=await dir.getDirectoryHandle("Grabaciones",{create:true}),s=await f.getDirectoryHandle(x.student.replace(/[\\/:*?"<>|]/g,"_"),{create:true}),bin=atob(x.audioData.split(",")[1]),a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);let h=await s.getFileHandle(filename(x.student,x.date),{create:true}),w=await h.createWritable();await w.write(a);await w.close()}catch(e){console.warn(e)}}
q("chooseFolder").onclick=async()=>{if(!showDirectoryPicker)return alert("Este navegador no permite seleccionar carpetas.");try{dir=await showDirectoryPicker({mode:"readwrite"});q("folderNote").textContent="Carpeta seleccionada: las grabaciones nuevas se copiarán en Grabaciones/Alumno/."}catch(e){}};
function download(b,n){let a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
q("csv").onclick=()=>{let a=lessons.filter(x=>(x.schoolYear||year())===year()),r=[["Fecha","Alumno","Curso","Estado","Nota","Observación","Grabación"],...a.map(x=>[x.date,x.student,x.course,x.attendance==="falta"?"Falta":"Asiste",x.grade??"",x.obs,x.audioData?"Sí":"No"])],c=r.map(z=>z.map(v=>`"${String(v??"").replace(/"/g,'""')}"`).join(";")).join("\n");download(new Blob(["\ufeff"+c],{type:"text/csv;charset=utf-8"}),`Registro_Clases_Oboe_${year()}.csv`)};
q("backup").onclick=()=>download(new Blob([JSON.stringify({version:4,schoolYear:year(),students,lessons})],{type:"application/json"}),`Copia_Registro_Clases_Oboe_${year()}.json`);
renderStudents();renderSelect();render();
</script></body></html>
